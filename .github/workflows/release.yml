name: Release

# Builds, tests and packs EGeier.Net and EGeier.Mcp when a version tag (v1.2.3) is pushed, and
# attaches the packages to a GitHub release. Upload the .nupkg files from the release to
# nuget.org by hand (https://www.nuget.org/packages/manage/upload).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release -p:Version=$VERSION

      - name: Unit tests
        run: dotnet test --project tests/EGeier.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "E-Geier $VERSION" --generate-notes
