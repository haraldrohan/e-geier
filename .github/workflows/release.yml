name: Release

# Publishes EGeier.Net and EGeier.Mcp to nuget.org when a version tag (v1.2.3) is pushed.
# Uses NuGet Trusted Publishing: no long-lived API key, see
# https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release -p:Version=$VERSION

      - name: Unit tests
        run: dotnet test --project tests/EGeier.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --title "E-Geier $VERSION" --generate-notes
